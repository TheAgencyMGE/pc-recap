name: Bug report
description: Report reproducible incorrect behavior in PC Recap.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach activity databases, backups, window titles, local paths, or other personal data.
  - type: input
    id: version
    attributes:
      label: PC Recap version
      placeholder: 1.2.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and version
      description: Include CPU architecture and, on Linux, whether you use X11 or Wayland.
      placeholder: Windows 11 x64, macOS 15 arm64, or Ubuntu 24.04 x64 X11
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include concise steps, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Additional context
      description: Include sanitized logs only when they contain no personal activity data.
