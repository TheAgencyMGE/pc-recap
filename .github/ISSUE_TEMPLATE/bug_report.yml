name: Bug report
description: Report reproducible incorrect behavior in PC Wrapped.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach activity databases, backups, window titles, local paths, or other personal data.
  - type: input
    id: version
    attributes:
      label: PC Wrapped version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include concise steps, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Additional context
      description: Include sanitized logs only when they contain no personal activity data.
