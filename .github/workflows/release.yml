name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm run postinstall

      - name: Verify source and release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const assert=require('node:assert/strict');const p=require('./package.json');const m=require('./release-metadata.json');assert.equal(p.version,m.version);assert.equal(process.env.RELEASE_TAG,'v'+p.version)"
          npm run test:run
          npm run typecheck
          npm run website:validate
          npm run promotion:test

  package:
    name: Package ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: package:win
            artifact: pc-recap-windows-x64
            paths: release/*.exe
          - name: macOS Intel and Apple Silicon
            os: macos-latest
            command: package:mac
            artifact: pc-recap-macos
            paths: release/*.dmg
          - name: Linux x64
            os: ubuntu-latest
            command: package:linux
            artifact: pc-recap-linux-x64
            paths: |-
              release/*.AppImage
              release/*.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm run postinstall

      - name: Build unsigned packages without implicit publishing
        run: npm run ${{ matrix.command }}

      - name: Stage release packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download packaged applications
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: pc-recap-*
          path: release
          merge-multiple: true

      - name: Verify every package and write checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:verify-all -- --write-checksums

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "$RELEASE_TAG" release/* --verify-tag --latest --title "PC Recap $VERSION Beta" --notes-file "docs/releases/$VERSION.md"
