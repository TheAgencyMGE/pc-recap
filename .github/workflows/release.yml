name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm run postinstall

      - name: Verify source
        run: |
          npm run test:run
          npm run typecheck
          npm run website:validate

      - name: Package installer and checksum
        run: |
          npm run package
          npm run release:prepare

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $metadata = Get-Content -Raw release-metadata.json | ConvertFrom-Json
          $installer = Join-Path release $metadata.fileName
          $checksum = "$installer.sha256"
          gh release create $env:RELEASE_TAG $installer $checksum --verify-tag --title "PC Recap $($metadata.version)" --generate-notes
